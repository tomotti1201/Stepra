<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>目標一覧 | STEPRA</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background-color: #f8f9fa; }

    /* 目標アイテムの枠線と背景 */
    .target-item {
      border: 1px solid #dee2e6;
      border-radius: 8px;
      overflow: hidden;
      background-color: #fff;
    }
    .target-content {
      font-weight: bold;
    }

    /* フッターナビゲーションのスタイル */
    .bottom-nav {
      border-top: 1px solid #dee2e6;
      background-color: #fff;
      padding: 10px 0;
    }
    .menu-item {
      color: #6c757d;
      text-decoration: none;
      font-size: 12px;
    }
    .menu-item.active {
      color: #0d6efd;
      font-weight: bold;
    }
  </style>
</head>
<body>

<!-- 【共通ルール準拠】レイアウトコンテナ -->
<div class="container py-4">
  <div class="row justify-content-center">
    <!-- 【共通ルール準拠】レスポンシブカラム幅 -->
    <div class="col-12 col-md-8 col-lg-5">

      <!-- 【共通ルール準拠】カード（card shadow） -->
      <div class="card shadow">
        <div class="card-body p-4">
          
          <!-- 【共通ルール準拠】タイトル（中央寄せ＋太字） -->
          <h2 class="text-center fw-bold mb-4 fs-4">
            目標一覧<br>
            <span class="fs-6 fw-normal text-muted">編集</span>
          </h2>

          <!-- 目標リスト（JavaScriptで動的生成） -->
          <div id="target-list" class="d-flex flex-column gap-2">
          </div>

          <!-- 【共通ルール準拠】新規作成・登録ボタンは btn-success -->
          <div class="mt-4">
            <a href="mokuhyosinki.html" class="btn btn-success w-100 py-2 fw-bold">
              ＋ 新規目標作成
            </a>
          </div>

        </div>

        <!-- フッターナビゲーション -->
        <div class="bottom-nav d-flex justify-content-around align-items-center rounded-bottom">
          <a href="#" class="menu-item text-center">📅<br>記録</a>
          <a href="#" class="menu-item text-center">🔄<br>履歴</a>
          <a href="#" class="menu-item text-center active">📊<br>分析</a>
          <a href="#" class="menu-item text-center">✅<br>目標</a>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const storageKey = 'goals';

  // 画面に目標一覧を組み立てて表示する関数
  function renderList() {
    const listContainer = document.getElementById('target-list');
    
    // 1. ブラウザから最新の保存データを読み込む
    let goals = localStorage.getItem(storageKey);
    goals = goals ? JSON.parse(goals) : [];

    // 2. 一度リストの中身をすべて空っぽにする
    listContainer.innerHTML = ''; 

    // データが無いときの案内
    if (goals.length === 0) {
      listContainer.innerHTML = '<div class="text-center text-muted small py-4">登録された目標がありません</div>';
      return;
    }

    // 3. 登録データでリストを組み立てる
    goals.forEach((goal) => {
      const item = document.createElement('div');
      item.className = 'target-item d-flex row g-0 align-items-center';

      // 左側：目標名表示エリア
      const content = document.createElement('div');
      content.className = 'target-content col-8 p-3 text-start d-flex align-items-center';
      content.textContent = goal.name; 

      if (goal.color) {
        content.style.borderLeft = `8px solid ${goal.color}`;
      }

      // 右側：編集ボタンエリア
      const editBtnWrapper = document.createElement('div');
      editBtnWrapper.className = 'col-4 px-2 text-end';

      const editLink = document.createElement('a');
      // 【共通ルール準拠】一覧内の編集ボタンは btn-primary を指定
      editLink.className = 'btn btn-sm btn-primary w-100';
      editLink.textContent = '編集';
      editLink.href = `mokuhyohensyu.html?id=${goal.id}`;

      editBtnWrapper.appendChild(editLink);
      item.appendChild(content);
      item.appendChild(editBtnWrapper);
      listContainer.appendChild(item);
    });
  }

  // 画面が表示されたタイミングに、最新データを読み込んで一覧を表示する
  document.addEventListener('DOMContentLoaded', renderList);
</script>
</body>
</html>
