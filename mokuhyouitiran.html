<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>目標一覧</title>

<style>
body {
  background: #e6e6e6;
  font-family: sans-serif;
  margin: 0;
}

/* 全体カード */
.container {
  width: 360px;
  margin: 20px auto;
  background: #b8c5d0;
  border-radius: 40px;
  border: 2px solid #333;
  padding: 10px;
}

/* 上タイトル */
.header {
  text-align: center;
  background: #3cff00;
  padding: 10px;
  border: 1px solid #999;
  margin-bottom: 10px;
  font-size: 18px;
}

/* 各項目 */
.item {
  display: flex;
  margin-bottom: 15px;
}

/* 左（内容） */
.content {
  flex: 2;
  background: #eee;
  padding: 25px 10px;
  text-align: center;
  border: 1px solid #999;
}

/* 右（ボタン） */
.buttons {
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* 編集 */
.edit {
  background: #5b82b1;
  color: black;
  text-align: center;
  padding: 15px;
  border: 1px solid #333;
  text-decoration: none;
  cursor: pointer;
}

/* 削除 */
.delete {
  background: #c05050;
  color: white;
  text-align: center;
  padding: 15px;
  border: 1px solid #333;
  text-decoration: none;
  cursor: pointer;
}

/* 新規作成ボタン */
.create {
  margin: 15px 0;
  background: #3cff00;
  text-align: center;
  padding: 15px;
  font-size: 24px;
  border: 1px solid #999;
  display: block;
  text-decoration: none;
  color: black;
}

/* 下メニュー */
.menu-bar {
  display: flex;
  justify-content: space-around;
  align-items: center;
  background: #f0f0f0;
  padding: 10px 0;
  border-top: 1px solid #aaa;
  border-radius: 0 0 30px 30px;
}

.menu-item {
  text-align: center;
  font-size: 12px;
  color: #555;
  text-decoration: none;
  cursor: pointer;
}

.active {
  color: purple;
  font-weight: bold;
}
</style>

</head>
<body>

<div class="container">

  <div class="header">
    目標一覧<br>
    <small>編集・削除</small>
  </div>

  <!-- アイテム -->
  <div class="item">
    <div class="content">目標内容</div>
    <div class="buttons">
      <a href="#" class="edit">編集</a>
      <a href="#" class="delete">削除</a>
    </div>
  </div>

  <div class="item">
    <div class="content">目標内容</div>
    <div class="buttons">
      <a href="#" class="edit">編集</a>
      <a href="#" class="delete">削除</a>
    </div>
  </div>

  <div class="item">
    <div class="content">目標内容</div>
    <div class="buttons">
      <a href="#" class="edit">編集</a>
      <a href="#" class="delete">削除</a>
    </div>
  </div>

  <div class="item">
    <div class="content">目標内容</div>
    <div class="buttons">
      <a href="#" class="edit">編集</a>
      <a href="#" class="delete">削除</a>
    </div>
  </div>

  <!-- 新規作成 -->
  <a href="#" class="create">
    新規目標作成
  </a>

  <!-- メニュー -->
  <div class="menu-bar">
    <a href="#" class="menu-item">📅<br>記録</a>
    <a href="#" class="menu-item">🔄<br>履歴</a>
    <a href="#" class="menu-item active">📊<br>分析</a>
    <a href="#" class="menu-item">✅<br>目標</a>
  </div>

</div>

</body>
</html>
