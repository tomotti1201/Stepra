<!-- ===================================================== -->
<!-- HTML -->
<!-- ===================================================== -->

<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>STEPRA 新規グループ作成</title>





<!-- ===================================================== -->
<!-- CSS -->
<!-- ===================================================== -->

<style>

*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: sans-serif;
}

body{

  background: #d9d9d9;

  display: flex;
  justify-content: center;
  align-items: center;

  min-height: 100vh;

  padding: 10px;
}

/* ===================================================== */
/* スマホ */
/* ===================================================== */

.phone{

  width: 100%;
  max-width: 390px;

  height: 100vh;

  background: #d8e8da;

  border: 6px solid #666;

  border-radius: 35px;

  overflow: hidden;

  position: relative;

  padding-top: 30px;
}

/* ===================================================== */
/* タイトル */
/* ===================================================== */

.create-title{

  width: 230px;
  height: 55px;

  margin: 0 auto;

  border: 2px solid black;

  border-radius: 12px;

  background: #3cff00;

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 20px;
}

/* ===================================================== */
/* 入力エリア */
/* ===================================================== */

.form-area{

  margin-top: 60px;

  display: flex;
  flex-direction: column;
  align-items: center;

  gap: 28px;
}

/* ===================================================== */
/* グループ説明 */
/* ===================================================== */

.group-textarea{

  width: 280px;

  min-height: 70px;

  max-height: 200px;

  border: 2px solid #555;

  background: white;

  padding: 10px;

  font-size: 15px;

  resize: none;

  overflow-y: auto;

  outline: none;
}

/* ===================================================== */
/* 入力欄 */
/* ===================================================== */

.group-input{

  width: 280px;
  height: 40px;

  border: 2px solid #555;

  background: white;

  padding-left: 10px;

  font-size: 15px;
}

/* ===================================================== */
/* ボタン */
/* ===================================================== */

.create-btn{

  width: 290px;
  height: 55px;

  border: 2px solid black;

  border-radius: 12px;

  background: #3cff00;

  font-size: 20px;

  cursor: pointer;

  transition: 0.2s;
}

/* ===================================================== */
/* 無効ボタン */
/* ===================================================== */

.disabled-btn{

  background: #3cff00;

  color: #666;

  cursor: not-allowed;
}

/* ホバー */

.create-btn:hover{

  background: #3cff00;
}

/* 押した時 */

.create-btn:active{

  transform: scale(0.98);
}

/* ===================================================== */
/* 下メニュー */
/* ===================================================== */

.bottom-menu{

  width: 100%;
  height: 70px;

  background: #f2f2f2;

  position: absolute;

  bottom: 0;

  border-top: 2px solid #ccc;

  display: flex;
  justify-content: space-around;
  align-items: center;
}

/* ボタン */

.menu-btn{

  width: 50px;
  height: 50px;

  border: none;

  background: transparent;

  font-size: 30px;

  color: #777;

  cursor: pointer;

  border-radius: 12px;
}

/* 選択中 */

.active-btn{

  color: #8e5eff;

  font-weight: bold;
}

</style>

</head>





<!-- ===================================================== -->
<!-- BODY -->
<!-- ===================================================== -->

<body>

<div class="phone">

  <!-- タイトル -->

  <div class="create-title">

    新規作成

  </div>

  <!-- 入力欄 -->

  <div class="form-area">

    <input type="text"
       class="group-input"
       id="groupName"
       placeholder="グループ名"
       oninput="checkGroupName()" aria-label="Group name" title="Group name">

    <textarea class="group-textarea"
          placeholder="グループ説明(任意)"
          oninput="autoResize(this)" aria-label="Group description" title="Group description"></textarea>
    
    <button class="create-btn disabled-btn"
        id="createGroupBtn"
        onclick="createGroup()"
        disabled>

  グループ作成

</button>

    <!-- 戻る -->

    <button class="create-btn"
            onclick="goBack()">

      戻る

    </button>

  </div>

  <!-- 下メニュー -->

  <div class="bottom-menu">

    <button class="menu-btn">
      ⌂
    </button>

    <button class="menu-btn">
      ◷
    </button>

    <button class="menu-btn">
      ▤
    </button>

    <button class="menu-btn active-btn">
      ◉
    </button>

    <button class="menu-btn">
      ☷
    </button>

  </div>

</div>





<!-- ===================================================== -->
<!-- JavaScript -->
<!-- ===================================================== -->

<script>
/* ===================================================== */
/* グループ作成 */
/* ===================================================== */

function createGroup(){

  alert("グループを作成しました");
}

/* ===================================================== */
/* 高さ自動変更 */
/* ===================================================== */

function autoResize(textarea){

  /* 一旦高さリセット */

  textarea.style.height = "auto";

  /* 内容の高さ取得 */

  let newHeight =
    textarea.scrollHeight;

  /* 最大高さ */

  const maxHeight = 200;

  /* 上限超えたら固定 */

  if(newHeight > maxHeight){

    newHeight = maxHeight;
  }

  textarea.style.height =
    newHeight + "px";
}

/* ===================================================== */
/* グループ名入力チェック */
/* ===================================================== */

function checkGroupName(){

  const groupName =
    document.getElementById("groupName")
      .value;

  const button =
    document.getElementById("createGroupBtn");

  /* グループ名入力済み */

  if(groupName.trim() !== ""){

    button.disabled = false;

    button.classList.remove("disabled-btn");

  }

  /* 未入力 */

  else{

    button.disabled = true;

    button.classList.add("disabled-btn");
  }
}

/* ===================================================== */
/* 戻る */
/* ===================================================== */

function goBack(){

  window.location.href =
    "gurupu.html";
}

</script>

</body>
</html>
