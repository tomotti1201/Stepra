<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>STEPRA ログイン画面</title>

  <style>

    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: sans-serif;
    }

    body{
      background-color: #d9d9d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    /* ===== スマホ本体 ===== */

    .phone{
      width: 100%;
      max-width: 390px;
      height: 90vh;

      background-color: #d8e8da;
      border: 2px solid black;
      border-radius: 45px;

      padding-top: 25px;
      position: relative;
    }

    /* ===== タイトル ===== */

    .title{
      width: 75%;
      height: 100px;

      background-color: #3cff00;

      margin: 25px auto 0 auto;   /* タイトルの上下の余白 */

      border: 1px solid black;
      border-radius: 15px;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 2rem;
      font-weight: bold;
    }

    /* ===== 入力フォーム ===== */

    .form-area{
      margin-top: 30px;   /* タイトルとフォームの余白 */

      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .input-group{
      width: 75%;
      margin-bottom: 15px;
    }

    .input-group label{
      font-size: 1rem;
    }

    .input-group input{
      width: 100%;
      height: 50px;

      border: 1px solid black;

      padding-left: 10px;
      font-size: 0.9rem;

      margin-top: 3px;
    }

    /* ===== ログインボタン ===== */

    .login-btn{
      width: 80%;
      height: 70px;

      background-color: #3cff00;

      border: 1px solid black;
      border-radius: 12px;

      margin-top: 20px;

      cursor: pointer;

      font-size: 1.7rem;
      font-weight: bold;
    }

    /* ===== 下のボタン ===== */

    .sub-btn{
      width: 70%;
      height: 35px;

      margin-top: 28px;

      border: 1px solid #eaf5eb;

      background-color: #eef4ee;

      font-size: 0.85rem;

      cursor: pointer;
    }

    .sub-btn:last-child{
      margin-top: 20px;
    }

    .message{
      margin-top: 15px;
      font-size: 0.9rem;
      color: #333;
    }

    /* ===== エラー画面 ===== */

    .overlay{
      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background: rgba(0,0,0,0.3);

      display: none;

      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .error-box{
      width: 100%;
      max-width: 280px;

      background-color: #f6b8b8;

      border: 1px solid white;
      border-radius: 10px;

      padding: 30px 20px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .error-title{
      color: rgb(179, 0, 0);

      font-size: 1.5rem;
      font-weight: bold;

      margin-bottom: 20px;
    }

    .error-text{
      font-size: 1rem;
      text-align: center;
      line-height: 1.7;
    }

    .close-btn{
      margin-top: 20px;

      width: 80px;
      height: 35px;

      border: 1px solid black;

      cursor: pointer;

      background-color: rgb(238, 106, 106);

      font-size: 1rem;
    }

    /* ===== 小さいスマホ用 ===== */

    @media (max-width: 400px){

      .title{
        font-size: 1.8rem;
      }

      .login-btn{
        font-size: 1.4rem;
      }

      .phone{
        border-radius: 30px;
      }

    }

  </style>
</head>

<body>

  <div class="phone">

    <div class="title">
      STEPRA
    </div>

    <div class="form-area">

      <div class="input-group">
        <label>ユーザー名</label>
        <input type="text" id="username" placeholder="ユーザー名を入力" aria-label="Username" title="Username">
      </div>

      <div class="input-group">
        <label>メールアドレス</label>
        <input 
          type="email"
          id="email"
          placeholder="メールアドレスを入力"
         aria-label="Email address" title="Email address">
      </div>

      <div class="input-group">
        <label>パスワード</label>
        <input type="password" id="password" placeholder="パスワードを入力" aria-label="Password" title="Password">
      </div>

      <button class="login-btn" onclick="login()">
        ログイン
      </button>

      <button class="sub-btn">
        パスワードを忘れた場合
      </button>

      <button class="sub-btn">
        新規アカウント作成
      </button>

      <div class="message" id="message"></div>

    </div>

  </div>

  <!-- エラー画面 -->

  <div class="overlay" id="overlay">

    <div class="error-box">

      <div class="error-title">
        エラー
      </div>

      <div class="error-text">
        ユーザー名、<br>メールアドレスまたは、<br>
        パスワードが違います
      </div>

      <button class="close-btn" onclick="closeError()">
        OK
      </button>

    </div>

  </div>

  <script>

    function login() {

      const username = document.getElementById("username").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      const validUsername = "user";
      const validPassword = "pass";

      if (
        username === "" ||
        email === "" ||
        password === "" ||
        username !== validUsername ||
        email !== validEmail ||
        password !== validPassword
      ) {

        document.getElementById("overlay").style.display = "flex";

      } else {

        message.textContent = "ログインに成功しました";

      }

    }

    function closeError() {
      document.getElementById("overlay").style.display = "none";
    }

  </script>

</body>
</html>
