<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>パスワード再設定</title>
<style>
    body {
        background-color: #e6e6e6;
        font-family: sans-serif;
    }

    .container {
        max-width: 350px;
        width: 90%;
        margin: 40px auto;
        padding: 25px;
        background-color: #d8e8da;
        border-radius: 40px;
        border: 2px solid #333;
        box-sizing: border-box;
    }

    .title {
        color: #333;
        text-align: center;
        margin-bottom: 20px;
        font-size: 16px;
        font-weight: bold;
    }

    .form-group {
        margin-bottom: 15px;
    }

    label {
        font-size: 13px;
        display: block;
        margin-bottom: 5px;
    }

    input {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #999;
        background-color: white;
        box-sizing: border-box;
    }

    .submit-btn {
        width: 100%;
        padding: 12px;
        background-color: #3cff00;
        color: #333;
        border: 1px solid #333;
        border-radius: 8px;
        margin-top: 10px;
        font-size: 16px;
        cursor: pointer;
    }

    .submit-btn:hover {
        background-color: #45a049;
    }

    .back-btn {
        width: 100%;
        padding: 12px;
        background-color: #e35d5d;
        color: #333;
        border: 1px solid #333;
        border-radius: 8px;
        margin-top: 10px;
        font-size: 16px;
        cursor: pointer;
    }

    .back-btn:hover {
        background-color: #c94c4c;
    }
</style>
</head>

<body>

<div class="container">

    <div class="title">パスワード再発行</div>

    <form action="reset_password.php" method="POST">
        <div class="form-group">
            <label>メールアドレス</label>
            <input type="email" name="email" placeholder="example@email.com" required>
        </div>

        <div class="form-group">
            <label>生年月日</label>
            <input type="text" name="birthdate" placeholder="例: 2000/01/01" required>
        </div>

        <div class="form-group">
            <label>新しいパスワード</label>
            <input type="password" name="password" required>
        </div>

        <div class="form-group">
            <label>新しいパスワード（確認）</label>
            <input type="password" name="password_confirm" required>
        </div>

        <button type="submit" class="submit-btn">再設定する</button>
        <button type="button" class="back-btn" onclick="history.back()">戻る</button>
    </form>

</div>

</body>
</html>
