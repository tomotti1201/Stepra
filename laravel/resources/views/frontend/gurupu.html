<!-- ===================================================== -->
<!-- HTML -->
<!-- ===================================================== -->

<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>STEPRA グループ画面</title>





<!-- ===================================================== -->
<!-- CSS -->
<!-- ===================================================== -->

<style>

*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: sans-serif;
}

body{

  background: #d9d9d9;

  display: flex;
  justify-content: center;
  align-items: center;

  min-height: 100vh;

  padding: 10px;
}

/* ===================================================== */
/* スマホ本体 */
/* ===================================================== */

.phone{

  width: 100%;
  max-width: 390px;

  height: 100vh;

  background: #d8e8da;

  border: 6px solid #666;

  border-radius: 35px;

  overflow: hidden;

  position: relative;
}

/* ===================================================== */
/* タイトル */
/* ===================================================== */

.group-title{

  width: 270px;
  height: 70px;

  background: #3cff00;

  border: 2px solid black;

  border-radius: 12px;

  margin: 20px auto 30px auto;

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 26px;

  font-weight: bold;
}

/* ===================================================== */
/* 上ボタンエリア */
/* ===================================================== */

.top-buttons{

  width: 100%;

  display: flex;
  justify-content: center;

  gap: 18px;

  margin-bottom: 25px;
}

/* ===================================================== */
/* ボタン */
/* ===================================================== */

.group-btn{

  width: 120px;
  height: 75px;

  background: white;

  border: 2px solid #555;

  font-size: 18px;

  cursor: pointer;

  transition: 0.2s;
}

.group-btn:hover{

  background: #f0f0f0;
}

.group-btn:active{

  transform: scale(0.95);
}

/* ===================================================== */
/* グループ一覧 */
/* ===================================================== */

.group-list{

  width: calc(100% - 60px);

  height: 380px;

  background: white;

  border: 3px solid #555;

  margin: 0 auto;

  padding: 10px;

  overflow-y: auto;
}

/* 一覧タイトル */

.list-title{

  font-size: 18px;

  margin-bottom: 15px;

  font-weight: bold;
}

/* ===================================================== */
/* グループボタン */
/* ===================================================== */

.group-item{

  width: 100%;

  height: 48px;

  margin-bottom: 12px;

  background: #f8f8f8;

  border: 2px solid #999;

  border-radius: 10px;

  text-align: left;

  padding-left: 15px;

  font-size: 18px;

  cursor: pointer;

  transition: 0.2s;
}

.group-item:hover{

  background: #eeeeee;
}

.group-item:active{

  transform: scale(0.98);
}

/* ===================================================== */
/* 下メニュー */
/* ===================================================== */

.bottom-menu{

  width: 100%;
  height: 70px;

  background: #f2f2f2;

  position: absolute;

  bottom: 0;

  border-top: 2px solid #ccc;

  display: flex;
  justify-content: space-around;
  align-items: center;
}

/* ボタン */

.menu-btn{

  width: 50px;
  height: 50px;

  border: none;

  background: transparent;

  font-size: 30px;

  color: #777;

  cursor: pointer;

  border-radius: 12px;

  transition: 0.2s;
}

/* 押した時 */

.menu-btn:active{

  transform: scale(0.9);
}

/* 選択中 */

.active-btn{

  color: #8e5eff;

  font-weight: bold;
}

/* ===================================================== */
/* モーダル背景 */
/* ===================================================== */

.overlay{

  position: fixed;

  top: 0;
  left: 0;

  width: 100%;
  height: 100%;

  background: rgba(0,0,0,0.3);

  display: none;

  justify-content: center;
  align-items: center;

  z-index: 100;
}

/* ===================================================== */
/* モーダル */
/* ===================================================== */

.join-modal{

  width: 320px;

  background: white;

  border: 2px solid #555;

  padding: 20px;

  position: relative;

  text-align: center;
}

/* 閉じる */

.close-btn{

  position: absolute;

  top: 10px;
  left: 10px;

  width: 35px;
  height: 35px;

  border: 2px solid black;

  background: white;

  font-size: 22px;

  cursor: pointer;
}

/* タイトル */

.join-title{

  font-size: 24px;

  margin-bottom: 20px;

  font-weight: bold;
}

/* 入力欄 */

.group-input{

  width: 100%;

  height: 40px;

  border: 2px solid #777;

  padding-left: 10px;

  font-size: 16px;

  margin-bottom: 20px;
}

/* 検索ボタン */

.search-btn{

  width: 100%;

  height: 45px;

  background: #3cff00;

  border: 2px solid black;

  font-size: 18px;

  cursor: pointer;

  margin-bottom: 20px;
}

/* 検索結果 */

.search-result{

  border: 2px solid #777;

  background: #f8f8f8;

  padding: 20px;

  font-size: 18px;
}

/* 結果ボタン */

.result-buttons{

  display: flex;

  justify-content: center;

  gap: 15px;

  margin-top: 20px;
}

.result-btn{

  width: 120px;
  height: 55px;

  border: 2px solid #555;

  background: white;

  font-size: 16px;

  cursor: pointer;
}

</style>

</head>





<!-- ===================================================== -->
<!-- BODY -->
<!-- ===================================================== -->

<body>

<div class="phone">

  <!-- タイトル -->

  <div class="group-title">

    グループ

  </div>

  <!-- 上ボタン -->

  <div class="top-buttons">

    <button class="group-btn"
        onclick="goCreateGroup()">

      新規<br>
      グループ作成

    </button>

    <button class="group-btn"
            onclick="joinGroup()">

      グループに<br>入る

    </button>

  </div>

  <!-- ===================================================== -->
<!-- グループ参加モーダル -->
<!-- ===================================================== -->

<div class="overlay"
     id="joinOverlay">

  <div class="join-modal">

    <!-- 閉じる -->

    <button class="close-btn"
            onclick="closeJoinModal()">

      ×

    </button>

    <!-- タイトル -->

    <div class="join-title">

      グループを探す

    </div>

    <!-- 入力 -->

    <input type="text"
           id="groupCode"
           class="group-input"
           placeholder="グループコードを入力してください" aria-label="Group code" title="Group code">

    <!-- 検索 -->

    <button class="search-btn"
            onclick="searchGroup()">

      グループを探す

    </button>

    <!-- 検索結果 -->

    <div class="search-result"
     id="searchResult"
     style="display: none;">

</div>

  </div>

</div>

  <!-- グループ一覧 -->

  <div class="group-list">

    <div class="list-title">

      グループ一覧

    </div>

    <button class="group-item"
            onclick="openGroup(1)">

      グループ1

    </button>

    <button class="group-item"
            onclick="openGroup(2)">

      グループ2

    </button>

    <button class="group-item"
            onclick="openGroup(3)">

      グループ3

    </button>

    <button class="group-item"
            onclick="openGroup(4)">

      グループ4

    </button>

    <button class="group-item"
            onclick="openGroup(5)">

      グループ5

    </button>

  </div>

  <!-- 下メニュー -->

  <div class="bottom-menu">

    <button class="menu-btn">
      ⌂
    </button>

    <button class="menu-btn">
      ◷
    </button>

    <button class="menu-btn">
      ▤
    </button>

    <button class="menu-btn active-btn">
      ◉
    </button>

    <button class="menu-btn">
      ☷
    </button>

  </div>

</div>





<!-- ===================================================== -->
<!-- JavaScript -->
<!-- ===================================================== -->

<script>

/* ===================================================== */
/* 新規グループ作成 */
/* ===================================================== */

function createGroup(){

  alert("新規グループ作成画面へ");
}

/* ===================================================== */
/* 新規グループ作成画面へ */
/* ===================================================== */

function goCreateGroup(){

  window.location.href =
    "sinnkiguru.html";
}

/* ===================================================== */
/* グループ参加 */
/* ===================================================== */

function joinGroup(){

  document.getElementById("joinOverlay")
    .style.display = "flex";
}

/* ===================================================== */
/* グループを開く */
/* ===================================================== */

function openGroup(number){

  alert("グループ" + number + " を開きます");
}

/* ===================================================== */
/* 下メニュー切替 */
/* ===================================================== */

const menuButtons =
  document.querySelectorAll(".menu-btn");

menuButtons.forEach(button => {

  button.addEventListener("click", () => {

    menuButtons.forEach(btn => {
      btn.classList.remove("active-btn");
    });

    button.classList.add("active-btn");

  });

});

/* ===================================================== */
/* 閉じる */
/* ===================================================== */

function closeJoinModal(){

  /* モーダルを閉じる */

  document.getElementById("joinOverlay")
    .style.display = "none";

  /* 入力欄を空にする */

  document.getElementById("groupCode")
    .value = "";

  /* 検索結果を消す */

  const result =
    document.getElementById("searchResult");

  result.style.display = "none";

  result.innerHTML = "";
}

/* ===================================================== */
/* グループ検索 */
/* ===================================================== */

function searchGroup(){

  const code =
    document.getElementById("groupCode")
      .value;

  const result =
    document.getElementById("searchResult");

  /* 最初は非表示なので表示 */

  result.style.display = "block";

  /* =========================
     グループが存在する場合
  ========================= */

  if(code === "12345"){

    result.innerHTML = `

      検索結果<br><br>

      グループ名：STEPRA勉強会<br><br>

      <div class="result-buttons">

        <button class="result-btn"
                onclick="searchAgain()">

          別のグループを探す

        </button>

        <button class="result-btn"
                onclick="enterGroup()">

          このグループに入る

        </button>

      </div>

    `;

  }else{
      /* =========================
     グループが存在しない場合
  ========================= */
    result.innerHTML = `

      検索結果<br><br>

      グループが見つかりませんでした<br><br>

      <div class="result-buttons">

        <button class="result-btn"
                onclick="searchAgain()">

          他のグループを探す

        </button>

      </div>

    `;
  }
}

/* ===================================================== */
/* 別のグループを探す */
/* ===================================================== */

function searchAgain(){

  /* 入力欄を空にする */

  document.getElementById("groupCode")
    .value = "";

  /* 検索結果を非表示 */

  const result =
    document.getElementById("searchResult");

  result.style.display = "none";

  /* 中身も空にする */

  result.innerHTML = "";
}

/* ===================================================== */
/* グループ参加 */
/* ===================================================== */

function enterGroup(){

  alert("グループに参加しました");

  /* モーダルを閉じる */

  document.getElementById("joinOverlay")
    .style.display = "none";

  /* 入力欄リセット */

  document.getElementById("groupCode")
    .value = "";

  /* 検索結果を消す */

  const result =
    document.getElementById("searchResult");

  result.style.display = "none";

  result.innerHTML = "";
}

</script>

</body>
</html>
