<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>新規登録</title>
<style>
    body {
        background-color: #e6e6e6;
        font-family: sans-serif;
    }

    .container {
        width: 350px;
        margin: 30px auto;
        padding: 25px;
        background-color: #d8e8da;;
        border-radius: 40px;
        border: 2px solid #333;
    }

    .title {
        text-align: center;
        padding: 10px;
        background-color: #3cff00;
        border: 1px solid #333;
        border-radius: 10px;
        margin-bottom: 20px;
        font-size: 16px;
    }

    .form-group {
        margin-bottom: 15px;
    }

    input {
        width: 100%;
        padding: 10px;
        border: 1px solid #999;
        background-color: white;
        box-sizing: border-box;
    }

    .submit-btn {
        width: 100%;
        padding: 12px;
        background-color: #3cff00;
        color: #333;
        border: 1px solid #333;
        margin-top: 10px;
        cursor: pointer;
        font-size: 14px;
    }

    .back-btn {
        width: 100%;
        padding: 12px;
        background-color: #f26c6c;
        color: #333;
        border: 1px solid #333;
        margin-top: 10px;
        cursor: pointer;
        font-size: 14px;
    }
</style>
</head>

<body>

<div class="container">
    <div class="title">新規登録</div>
    <form action="register.php" method="POST">
        <div class="form-group">
            <input type="text" name="username" placeholder="ユーザー名" required>
        </div>
        <div class="form-group">
            <input type="email" name="email" placeholder="メールアドレス" required>
        </div>
        <div class="form-group">
            <input type="text" name="birthdate" placeholder="生年月日(例:2000/01/01)" required>
        </div>
        <div class="form-group">
            <input type="password" name="password" placeholder="パスワード" required>
        </div>
        <div class="form-group">
            <input type="password" name="password_confirm" placeholder="パスワード再入力" required>
        </div>
        <button type="submit" class="submit-btn">登録する</button>
        <button type="button" class="back-btn" onclick="history.back()">取消・戻る</button>
    </form>
</div>

</body>
</html>
