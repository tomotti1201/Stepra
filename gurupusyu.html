<!-- ===================================================== -->
<!-- HTML -->
<!-- ===================================================== -->

<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>STEPRA グループ詳細</title>





<!-- ===================================================== -->
<!-- CSS -->
<!-- ===================================================== -->

<style>

*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: sans-serif;
}

body{

  background: #d9d9d9;

  display: flex;
  justify-content: center;
  align-items: center;

  min-height: 100vh;

  padding: 10px;
}

/* ===================================================== */
/* スマホ */
/* ===================================================== */

.phone{

  width: 100%;
  max-width: 390px;

  height: 100vh;

  background: #d8e8da;

  border: 6px solid #666;

  border-radius: 35px;

  overflow: hidden;

  position: relative;
}

/* ===================================================== */
/* タブレット */
/* ===================================================== */

@media screen and (min-width: 768px){

  .phone{

    max-width: 700px;

    border-radius: 45px;
  }

  .detail-title{

    width: 320px;

    height: 70px;

    font-size: 32px;
  }

  .group-btn{

    width: 200px;

    height: 70px;

    font-size: 20px;
  }

  .edit-btn{

    width: 220px;

    height: 150px;

    font-size: 30px;
  }

  .calendar-title{

    font-size: 38px;
  }

  .day{

    height: 80px;

    font-size: 20px;
  }

}

/* ===================================================== */
/* PC */
/* ===================================================== */

@media screen and (min-width: 1200px){

  body{

    padding: 30px;
  }

  .phone{

    max-width: 1000px;

    border-radius: 50px;
  }

  .detail-title{

    width: 400px;

    height: 80px;

    font-size: 40px;
  }

  .top-button-area{

    gap: 30px;
  }

  .group-btn{

    width: 260px;

    height: 90px;

    font-size: 24px;
  }

  .edit-btn{

    width: 280px;

    height: 190px;

    font-size: 38px;
  }

  .calendar-title{

    font-size: 46px;
  }

  .day{

    height: 100px;

    font-size: 24px;
  }

  .menu-btn{

    width: 70px;
    height: 70px;

    font-size: 40px;
  }

}

/* ===================================================== */
/* タイトル */
/* ===================================================== */

.detail-title{

  width: 230px;
  height: 55px;

  margin: 25px auto;

  border: 2px solid black;

  border-radius: 12px;

  background: #3cff00;

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 24px;

  font-weight: bold;
}

/* ===================================================== */
/* 上ボタン */
/* ===================================================== */

.top-button-area{

  width: 100%;

  display: flex;
  justify-content: center;

  gap: 12px;

  margin-top: 15px;
}

/* 左 */

.left-buttons{

  display: flex;
  flex-direction: column;

  gap: 10px;
}

/* ボタン */

.group-btn{

  width: 125px;
  height: 55px;

  border: 2px solid #555;

  background: white;

  font-size: 14px;

  cursor: pointer;

  transition: 0.2s;
}

/* 編集 */

.edit-btn{

  width: 130px;
  height: 120px;

  border: 2px solid #555;

  background: white;

  font-size: 22px;

  cursor: pointer;

  transition: 0.2s;
}

/* ホバー */

.group-btn:hover,
.edit-btn:hover{

  background: #f0f0f0;
}

/* 押した時 */

.group-btn:active,
.edit-btn:active{

  transform: scale(0.97);
}

/* ===================================================== */
/* カレンダー */
/* ===================================================== */

.calendar-area{

  width: calc(100% - 30px);

  margin: 15px auto;

  background: white;

  border: 2px solid #ccc;

  padding: 10px;
}

/* ===================================================== */
/* 月切替 */
/* ===================================================== */

.calendar-header{

  display: flex;
  justify-content: space-between;
  align-items: center;

  margin-bottom: 15px;
}

/* 左右ボタン */

.month-btn{

  width: 40px;
  height: 40px;

  border: 2px solid black;

  border-radius: 10px;

  background: white;

  font-size: 22px;

  cursor: pointer;
}

/* 年月 */

.calendar-title{

  font-size: 28px;

  font-weight: bold;

  color: #666;

  cursor: pointer;
}

/* 曜日 */

.week-row{

  display: grid;

  grid-template-columns: repeat(7, 1fr);

  margin-bottom: 10px;

  color: #ff8f7d;

  font-weight: bold;

  text-align: center;
}

/* 日付 */

.calendar-grid{

  display: grid;

  grid-template-columns: repeat(7, 1fr);

  gap: 5px;
}

/* 1日 */

.day{

  width: 100%;
  height: 55px;

  border-radius: 10px;

  position: relative;

  cursor: pointer;

  transition: 0.2s;

  display: flex;
  justify-content: center;
  align-items: flex-start;

  padding-top: 5px;

  font-size: 14px;
}

/* ホバー */

.day:hover{

  background: #f3f3f3;
}

/* 今日 */

.today{

  background: #dfffd7;

  border: 2px solid #30d158;
}

/* タスク色 */

.task-dot{

  width: 14px;
  height: 14px;

  border-radius: 50%;

  position: absolute;

  bottom: 8px;
  right: 8px;

  border: 1px solid black;
}

/* ===================================================== */
/* 下メニュー */
/* ===================================================== */

.bottom-menu{

  width: 100%;
  height: 70px;

  background: #f2f2f2;

  position: absolute;

  bottom: 0;

  border-top: 2px solid #ccc;

  display: flex;
  justify-content: space-around;
  align-items: center;
}

/* ボタン */

.menu-btn{

  width: 50px;
  height: 50px;

  border: none;

  background: transparent;

  font-size: 30px;

  color: #777;

  cursor: pointer;

  border-radius: 12px;
}

/* 選択中 */

.active-btn{

  color: #8e5eff;

  font-weight: bold;
}

/* ===================================================== */
/* モーダル背景 */
/* ===================================================== */

.overlay{

  position: fixed;

  top: 0;
  left: 0;

  width: 100%;
  height: 100%;

  background: rgba(0,0,0,0.3);

  display: none;

  justify-content: center;
  align-items: center;

  z-index: 100;
}

/* ===================================================== */
/* モーダル */
/* ===================================================== */

.calendar-modal{

  width: 300px;

  background: white;

  border: 2px solid black;

  border-radius: 12px;

  padding: 20px;

  position: relative;

  display: flex;
  flex-direction: column;
  align-items: center;

  gap: 15px;
}

/* タイトル */

.modal-title{

  font-size: 22px;

  margin-top: 10px;
}

/* 閉じる */

.close-btn{

  position: absolute;

  top: 10px;
  left: 10px;

  width: 35px;
  height: 35px;

  border: 2px solid black;

  border-radius: 8px;

  background: white;

  font-size: 20px;

  cursor: pointer;
}

/* セレクト */

.calendar-select{

  width: 180px;
  height: 40px;

  font-size: 16px;

  border: 2px solid #666;

  padding-left: 10px;
}

/* 移動 */

.move-btn{

  width: 180px;
  height: 45px;

  border: 2px solid black;

  background: #3cff00;

  font-size: 18px;

  cursor: pointer;

  border-radius: 10px;
}

@media screen and (min-width: 768px){
}

@media screen and (min-width: 1200px){
}

</style>

</head>





<!-- ===================================================== -->
<!-- BODY -->
<!-- ===================================================== -->

<body>

<div class="phone">

  <!-- タイトル -->

  <div class="detail-title">

    グループ詳細

  </div>

  <!-- 上ボタン -->

  <div class="top-button-area">

    <div class="left-buttons">

      <button class="group-btn"
              onclick="openTaskList()">

        グループタスク<br>
        表示する場所

      </button>

      <button class="group-btn"
              onclick="goTaskContinue()">

        グループタスクの<br>
        継続率画面

      </button>

    </div>

    <button class="edit-btn"
            onclick="editGroup()">

      グループ<br>編集

    </button>

  </div>

  <!-- カレンダー -->

  <div class="calendar-area">

    <!-- 年月切替 -->

    <div class="calendar-header">

      <button class="month-btn"
              onclick="changeMonth(-1)">

        ◀

      </button>

      <div class="calendar-title"
           onclick="openCalendarModal()"
           id="calendarTitle">

        2026年1月

      </div>

      <button class="month-btn"
              onclick="changeMonth(1)">

        ▶

      </button>

    </div>

    <!-- 曜日 -->

    <div class="week-row">

      <div>日</div>
      <div>月</div>
      <div>火</div>
      <div>水</div>
      <div>木</div>
      <div>金</div>
      <div>土</div>

    </div>

    <!-- 日付 -->

    <div class="calendar-grid"
         id="calendarGrid">

    </div>

  </div>

  <!-- 下メニュー -->

  <div class="bottom-menu">

    <button class="menu-btn">
      ⌂
    </button>

    <button class="menu-btn">
      ◷
    </button>

    <button class="menu-btn">
      ▤
    </button>

    <button class="menu-btn active-btn">
      ◉
    </button>

    <button class="menu-btn">
      ☷
    </button>

  </div>

</div>





<!-- ===================================================== -->
<!-- 年月変更モーダル -->
<!-- ===================================================== -->

<div class="overlay"
     id="calendarOverlay">

  <div class="calendar-modal">

    <!-- 閉じる -->

    <button class="close-btn"
            onclick="closeCalendarModal()">

      ×

    </button>

    <!-- タイトル -->

    <div class="modal-title">

      移動する年月

    </div>

    <!-- 年 -->

    <select id="yearSelect"
            class="calendar-select">

    </select>

    <!-- 月 -->

    <select id="monthSelect"
            class="calendar-select">

    </select>

    <!-- 移動 -->

    <button class="move-btn"
            onclick="changeCalendar()">

      移動

    </button>

  </div>

</div>





<!-- ===================================================== -->
<!-- JavaScript -->
<!-- ===================================================== -->

<script>

/* ===================================================== */
/* 今日の日付取得 */
/* ===================================================== */

const today = new Date();

/* 今日の年月 */

let currentYear =
  today.getFullYear();

let currentMonth =
  today.getMonth() + 1;

/* 今日 */

const todayDate =
  today.getDate();

/* ===================================================== */
/* タスク付き日付 */
/* ===================================================== */

/* ===================================================== */
/* DBから来るタスク情報 */
/* ===================================================== */

const taskData = [

  {
    startDate: "20260528",
    endDate: "20260710",

    weekdays: ["月", "水", "金"],

    color: "#30d158"
  },

  {
    startDate: "20260601",
    endDate: "20260620",

    weekdays: ["火", "木"],

    color: "#ff9500"
  }

];

/* ===================================================== */
/* 曜日変換 */
/* ===================================================== */

const weekMap = {

  "日": 0,
  "月": 1,
  "火": 2,
  "水": 3,
  "木": 4,
  "金": 5,
  "土": 6
};

/* ===================================================== */
/* YYYYMMDD → Date変換 */
/* ===================================================== */

function stringToDate(dateString){

  const year =
    Number(dateString.slice(0,4));

  const month =
    Number(dateString.slice(4,6));

  const day =
    Number(dateString.slice(6,8));

  return new Date(year, month - 1, day);
}

/* ===================================================== */
/* 年月表示 */
/* ===================================================== */

function updateCalendarTitle(){

  document.getElementById("calendarTitle")
    .textContent =
      currentYear + "年" +
      currentMonth + "月";
}

/* ===================================================== */
/* カレンダー生成 */
/* ===================================================== */

function createCalendar(){

  const calendar =
    document.getElementById("calendarGrid");

  calendar.innerHTML = "";

  /* 月初 */

  const firstDay =
    new Date(
      currentYear,
      currentMonth - 1,
      1
    ).getDay();

  /* 月末 */

  const lastDate =
    new Date(
      currentYear,
      currentMonth,
      0
    ).getDate();

  /* 空白 */

  for(let i = 0; i < firstDay; i++){

    const empty =
      document.createElement("div");

    calendar.appendChild(empty);
  }

  /* 日付 */

  for(let day = 1; day <= lastDate; day++){

    const dayElement =
      document.createElement("div");

    dayElement.className = "day";

    /* 今日判定 */

    if(
      currentYear === today.getFullYear() &&
      currentMonth === today.getMonth() + 1 &&
      day === todayDate
    ){

      dayElement.classList.add("today");
    }

    dayElement.innerHTML = day;

    /* タップ */

    dayElement.onclick = () => {

      alert(
        currentMonth + "月" +
        day + "日をタップ"
      );
    };

    /* タスク */

    /* ===================================================== */
/* タスク判定 */
/* ===================================================== */

const currentDate =
  new Date(
    currentYear,
    currentMonth - 1,
    day
  );

taskData.forEach(task => {

  const start =
    stringToDate(task.startDate);

  const end =
    stringToDate(task.endDate);

  /* 期間内か */

  if(
    currentDate >= start &&
    currentDate <= end
  ){

    /* 曜日 */

    const week =
      currentDate.getDay();

    /* 対象曜日 */

    const match =
      task.weekdays.some(
        dayText =>
          weekMap[dayText] === week
      );

    if(match){

      const dot =
        document.createElement("div");

      dot.className = "task-dot";

      dot.style.background =
        task.color;

      dayElement.appendChild(dot);
    }
  }

});

    calendar.appendChild(dayElement);
  }
}

/* ===================================================== */
/* 月変更 */
/* ===================================================== */

function changeMonth(move){

  currentMonth += move;

  /* 前年 */

  if(currentMonth < 1){

    currentMonth = 12;

    currentYear--;
  }

  /* 次年 */

  if(currentMonth > 12){

    currentMonth = 1;

    currentYear++;
  }

  updateCalendarTitle();

  createCalendar();
}

/* ===================================================== */
/* モーダルを開く */
/* ===================================================== */

function openCalendarModal(){

  createSelectOptions();

  document.getElementById("calendarOverlay")
    .style.display = "flex";
}

/* ===================================================== */
/* モーダルを閉じる */
/* ===================================================== */

function closeCalendarModal(){

  document.getElementById("calendarOverlay")
    .style.display = "none";
}

/* ===================================================== */
/* セレクト生成 */
/* ===================================================== */

function createSelectOptions(){

  const yearSelect =
    document.getElementById("yearSelect");

  const monthSelect =
    document.getElementById("monthSelect");

  yearSelect.innerHTML = "";

  monthSelect.innerHTML = "";

  /* 年 */

  for(let year = 2020;
      year <= 2035;
      year++){

    const option =
      document.createElement("option");

    option.value = year;

    option.textContent =
      year + "年";

    yearSelect.appendChild(option);
  }

  /* 月 */

  for(let month = 1;
      month <= 12;
      month++){

    const option =
      document.createElement("option");

    option.value = month;

    option.textContent =
      month + "月";

    monthSelect.appendChild(option);
  }

  yearSelect.value = currentYear;

  monthSelect.value = currentMonth;
}

/* ===================================================== */
/* 年月変更 */
/* ===================================================== */

function changeCalendar(){

  currentYear =
    Number(
      document.getElementById("yearSelect").value
    );

  currentMonth =
    Number(
      document.getElementById("monthSelect").value
    );

  updateCalendarTitle();

  createCalendar();

  closeCalendarModal();
}

/* ===================================================== */
/* ボタン処理 */
/* ===================================================== */

function openTaskList(){

  alert("タスク一覧");
}

function goTaskContinue(){

  alert("継続率画面");
}

function editGroup(){

  alert("グループ編集");
}

/* ===================================================== */
/* 初期表示 */
/* ===================================================== */

updateCalendarTitle();

createCalendar();

</script>

</body>
</html>
