<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パスワード再設定 | STEPRA</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- 【共通ルール準拠】レイアウトコンテナ -->
<div class="container py-5">
  <div class="row justify-content-center">
    <!-- 【共通ルール準拠】レスポンシブカラム幅（認証系画面に最適化） -->
    <div class="col-12 col-md-8 col-lg-5">

      <!-- 【共通ルール準拠】カード（card shadow） -->
      <div class="card shadow border-0">
        <div class="card-body p-4">
          
          <!-- 【共通ルール準拠】タイトル（中央寄せ＋太字） -->
          <h2 class="text-center fw-bold mb-4 fs-4">パスワード再設定</h2>

          <form action="reset_password.php" method="POST">
              
            <!-- 【共通ルール準拠】入力欄（form-control / form-label） -->
            <div class="mb-3">
              <label class="form-label small fw-bold">メールアドレス</label>
              <input type="email" class="form-control" name="email" placeholder="example@email.com" required>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">生年月日</label>
              <input type="text" class="form-control" name="birthdate" placeholder="20000101" pattern="\d{8}" title="8桁の数字（例:20000101）で入力してください" required>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">新しいパスワード</label>
              <input type="password" class="form-control" name="password" required>
            </div>

            <div class="mb-4">
              <label class="form-label small fw-bold">新しいパスワード（確認）</label>
              <input type="password" class="form-control" name="password_confirm" required>
            </div>

            <!-- 【共通ルール準拠】編集・再設定：btn-primary、戻る：btn-secondary -->
            <div>
              <button type="submit" class="btn btn-primary w-100 mb-2 py-2 fw-bold">再設定する</button>
              <button type="button" class="btn btn-secondary w-100 py-2" onclick="history.back()">戻る</button>
            </div>
          </form>

        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
