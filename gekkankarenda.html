<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>月間カレンダー | STEPRA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
<body class="bg-light">

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
      
      <div class="card shadow">
        <div class="card-body">
          
          <div class="text-center fw-bold mb-4 fs-4">月間カレンダー</div>

          <div class="d-flex justify-content-between align-items-center mb-3">
            <button class="btn btn-secondary" onclick="changeMonth(-1)">&lt;</button>
            <span id="current-month-display" class="fw-bold fs-5">2024年 1月</span>
            <button class="btn btn-secondary" onclick="changeMonth(1)">&gt;</button>
          </div>

          <div class="week d-grid text-center fw-bold border-bottom pb-2 mb-2" style="grid-template-columns: repeat(7, 1fr);">
            <div class="text-danger">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="text-primary">土</div>
          </div>
          
          <div id="calendar-days" class="d-grid gap-2 text-center" style="grid-template-columns: repeat(7, 1fr); align-items: center;">
          </div>

        </div>
      </div>

    </div>
  </div>
</div>

<script src="js/main.js"></script>
<script>
// 現在表示している日付の状態
const now = new Date();
let currentViewDate = new Date(now.getFullYear(), now.getMonth(), 1);

/**
 * カレンダーを描画する
 */
function renderCalendar() {
  const year = currentViewDate.getFullYear();
  const month = currentViewDate.getMonth();
  
  // 1. 月表示の更新
  const display = document.getElementById('current-month-display');
  if (display) display.innerText = `${year}年 ${month + 1}月`;

  // 2. 描画エリアの取得
  const daysContainer = document.getElementById('calendar-days');
  if (!daysContainer) {
    console.error("ID: calendar-days が見つかりません！");
    return;
  }
  daysContainer.innerHTML = ''; // 一旦クリア

  // 3. 日付計算
  const firstDayOfWeek = new Date(year, month, 1).getDay();
  const lastDate = new Date(year, month + 1, 0).getDate();

  // 4. 余白（前の月分）の追加
  for (let i = 0; i < firstDayOfWeek; i++) {
    const emptyDay = document.createElement('div');
    emptyDay.className = 'day py-1'; // 余白にも高さを合わせるため py-1 を追加
    daysContainer.appendChild(emptyDay);
  }

  // 5. 日付の生成
  for (let date = 1; date <= lastDate; date++) {
    const dayEl = document.createElement('div');
    dayEl.className = 'day py-1'; // クリックしやすさと見栄えのために上下パディングを追加
    dayEl.innerText = date; 

    // 土日のクラス付与（テキスト色をBootstrap標準に変更してさらに綺麗に）
    const dayOfWeek = new Date(year, month, date).getDay();
    if (dayOfWeek === 0) dayEl.classList.add('text-danger', 'fw-bold');
    if (dayOfWeek === 6) dayEl.classList.add('text-primary', 'fw-bold');

    daysContainer.appendChild(dayEl);
  }
  console.log(`${year}年${month+1}月を描画しました`);
}

function changeMonth(offset) {
  currentViewDate.setMonth(currentViewDate.getMonth() + offset);
  renderCalendar();
}

// 読み込み時に実行
document.addEventListener('DOMContentLoaded', renderCalendar);
</script>
