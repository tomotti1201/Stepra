<!-- ===================================================== -->
<!-- HTML -->
<!-- ===================================================== -->

<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>STEPRA ホーム画面</title>





<!-- ===================================================== -->
<!-- CSS -->
<!-- ===================================================== -->

<style>

*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: sans-serif;
}

body{

  background: #d9d9d9;

  display: flex;
  justify-content: center;
  align-items: center;

  min-height: 100vh;

  padding: 10px;
}

/* ===== スマホ本体 ===== */

.phone{

  width: 100%;
  max-width: 390px;

  height: 100vh;

  background: #d8e8da;

  border: 6px solid #666;
  border-radius: 35px;

  overflow: hidden;

  position: relative;
}

/* ===== タイトル ===== */

.top-bar{

  width: 100%;

  margin-top: 40px;

  display: flex;
  justify-content: center;
}

.schedule-title{

  width: 260px;
  height: 50px;

  border: 2px solid black;
  border-radius: 12px;

  background: #3cff00;

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 18px;
}

/* ===== 円グラフ ===== */

.chart-area{

  margin-top: 30px;

  display: flex;
  justify-content: center;
}

.circle-chart{

  width: 250px;
  height: 250px;

  border-radius: 50%;

  position: relative;

  border: 2px solid white;
}

/* 真ん中 */

.circle-chart::before{

  content: "";

  width: 140px;
  height: 140px;

  background: #d8e8da;

  border-radius: 50%;

  position: absolute;

  top: 50%;
  left: 50%;

  transform: translate(-50%, -50%);
}

/* ===== 円グラフラベル ===== */

.chart-label{

  position: absolute;

  font-size: 11px;

  font-weight: bold;

  background: rgba(255,255,255,0.9);

  padding: 2px 6px;

  border-radius: 10px;

  border: 1px solid #999;

  transform: translate(-50%, -50%);

  white-space: nowrap;

  z-index: 10;
}

/* ===== 目標タイトル ===== */

.goal-area{

  margin-top: 35px;

  display: flex;
  justify-content: center;
  align-items: center;

  gap: 10px;
}

.goal-title{

  width: 210px;
  height: 45px;

  border: 2px solid black;
  border-radius: 10px;

  background: #3cff00;

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 16px;
}

.change-btn{

  width: 40px;
  height: 40px;

  border: none;

  background: transparent;

  font-size: 28px;

  color: #8e5eff;

  cursor: pointer;
}

/* ===== 目標一覧 ===== */

.goal-list{

  margin-top: 25px;

  padding: 0 20px;

  max-height: 280px;

  overflow-y: auto;
}

/* スクロールバー */

.goal-list::-webkit-scrollbar{
  width: 5px;
}

.goal-list::-webkit-scrollbar-thumb{
  background: #999;
  border-radius: 10px;
}

/* ===== 目標1行 ===== */

.goal-item{

  display: flex;

  align-items: center;

  margin-bottom: 18px;

  gap: 8px;
}

/* ===== 目標文 ===== */

.goal-text{

  flex: 1;

  border-bottom: 3px solid #bdbdbd;

  padding-bottom: 4px;

  font-size: 14px;
}

/* ===== 取消 ===== */

.cancel-btn{

  width: 50px;
  height: 28px;

  border: 1px solid black;

  background: white;

  display: none;

  cursor: pointer;

  flex-shrink: 0;
}

/* ===== ○ボタン ===== */

.circle-btn{

  width: 36px;
  height: 36px;

  border-radius: 50%;

  border: 2px solid black;

  background: white;

  font-size: 18px;

  cursor: pointer;

  flex-shrink: 0;
}

/* ===== ×ボタン ===== */

.delete-btn{

  width: 36px;
  height: 36px;

  border: 2px solid black;

  background: white;

  font-size: 22px;

  display: flex;
  justify-content: center;
  align-items: center;

  cursor: pointer;

  flex-shrink: 0;
}

/* ===================================================== */
/* 下メニュー */
/* ===================================================== */

.bottom-menu{

  width: 100%;
  height: 70px;

  background: #f2f2f2;

  position: absolute;

  bottom: 0;

  border-top: 2px solid #ccc;

  display: flex;
  justify-content: space-around;
  align-items: center;
}

/* ボタン */

.menu-btn{

  width: 50px;
  height: 50px;

  border: none;

  background: transparent;

  font-size: 30px;

  color: #777;

  cursor: pointer;

  border-radius: 12px;

  transition: 0.2s;
}

/* 押した時 */

.menu-btn:active{

  transform: scale(0.9);
}

/* ホバー */

.menu-btn:hover{

  background: rgba(0,0,0,0.05);
}

/* 現在ページ */

.active-btn{

  color: #8e5eff;

  font-weight: bold;
}

/* =======================================
   モーダル表示中はラベル非表示
======================================= */

.hide-labels .chart-label{

  display: none;
}

/* ===== モーダル ===== */

.overlay{

  position: fixed;

  top: 0;
  left: 0;

  width: 100%;
  height: 100%;

  background: rgba(0,0,0,0.3);

  display: none;

  justify-content: center;
  align-items: center;
}

.reason-modal{

  width: 320px;

  background: white;

  border: 2px solid black;

  padding: 20px;
}

.modal-title{

  text-align: center;

  font-size: 20px;

  margin-bottom: 20px;
}

.reason-list{

  display: flex;
  flex-direction: column;

  gap: 12px;
}

.reason-item{

  display: flex;
  align-items: center;

  gap: 10px;

  padding: 5px;

  border-radius: 8px;

  cursor: pointer;
}

.reason-item input[type="radio"]{

  width: 18px;
  height: 18px;

  accent-color: blue;
}

.reason-item input[type="radio"]:checked + span{

  color: blue;

  font-weight: bold;
}

/* ===== 登録ボタン ===== */

.register-btn{

  width: 100%;
  height: 40px;

  margin-top: 25px;

  border: 2px solid black;

  background: #3cff00;

  font-size: 16px;

  cursor: pointer;
}

</style>

</head>





<!-- ===================================================== -->
<!-- HTML BODY -->
<!-- ===================================================== -->

<body>

<div class="phone">

  <!-- タイトル -->

  <div class="top-bar">

    <div class="schedule-title">
      本日のスケジュール
    </div>

  </div>

  <!-- 円グラフ -->

  <div class="chart-area">

    <div class="circle-chart"
         id="circleChart">

    </div>

  </div>

  <!-- 目標タイトル -->

  <div class="goal-area">

    <div class="goal-title"
         id="goalTitle">

      本日の目標一覧

    </div>

    <button class="change-btn"
            onclick="changeGoal()">

      ▶

    </button>

  </div>

  <!-- 目標一覧 -->

  <div class="goal-list"
       id="goalList">

  </div>

  <!-- 下メニュー -->

  <div class="bottom-menu">

  <button class="menu-btn">
    ⌂
  </button>

  <button class="menu-btn">
    ◷
  </button>

  <button class="menu-btn">
    ▤
  </button>

  <button class="menu-btn active-btn">
    ◉
  </button>

  <button class="menu-btn">
    ☷
  </button>

</div>

<!-- ===== モーダル ===== -->

<div class="overlay"
     id="overlay">

  <div class="reason-modal">

    <div class="modal-title">
      出来なかった理由
    </div>

    <div class="reason-list">

      <label class="reason-item">

        <input type="radio"
               name="reason">

        <span>
          急な用事が入った
        </span>

      </label>

      <label class="reason-item">

        <input type="radio"
               name="reason">

        <span>
          仮眠をしすぎた
        </span>

      </label>

      <label class="reason-item">

        <input type="radio"
               name="reason">

        <span>
          他ごとをしていて忘れていた
        </span>

      </label>

      <label class="reason-item">

        <input type="radio"
               name="reason">

        <span>
          やる気がなかった
        </span>

      </label>

    </div>

    <button class="register-btn"
            onclick="registerReason()">

      登録

    </button>

  </div>

</div>





<!-- ===================================================== -->
<!-- JavaScript -->
<!-- ===================================================== -->

<script>

/* =======================================
   円グラフ用タスク
======================================= */

const tasks = [

  {
    name: "睡眠",
    start: "00:00",
    duration: 420,
    color: "#5e5ce6"
  },

  {
    name: "学校",
    start: "09:00",
    duration: 360,
    color: "#30d158"
  },

  {
    name: "SNS",
    start: "16:00",
    duration: 120,
    color: "#2db4ff"
  },

  {
    name: "勉強",
    start: "19:00",
    duration: 180,
    color: "#ff9500"
  }

];

/* =======================================
   目標一覧
   最大5件
======================================= */

const goals = [

  "朝の運動をする",

  "課題を終わらせる",

  "SNSを1時間以内",

  "読書を30分する",

  "筋トレをする"

];

/* =======================================
   時間 → 分
======================================= */

function timeToMinutes(time){

  const [hour, minute] =
    time.split(":").map(Number);

  return hour * 60 + minute;
}

/* =======================================
   分 → 時間
======================================= */

function minutesToTime(minutes){

  let hour =
    Math.floor(minutes / 60);

  let minute =
    minutes % 60;

  if(hour >= 24){
    hour -= 24;
  }

  return `${String(hour).padStart(2,"0")}:${String(minute).padStart(2,"0")}`;
}

/* =======================================
   円グラフ生成
======================================= */

function createChart(){

  const chart =
    document.getElementById("circleChart");

  chart.innerHTML = "";

  let gradients = [];

  let currentPercent = 0;

  tasks.forEach(task => {

    const startMinutes =
      timeToMinutes(task.start);

    const endMinutes =
      startMinutes + task.duration;

    const startPercent =
      (startMinutes / 1440) * 100;

    const endPercent =
      (endMinutes / 1440) * 100;

    /* 空白時間 */

    if(startPercent > currentPercent){

      gradients.push(
        `#d8e8da ${currentPercent}% ${startPercent}%`
      );
    }

    /* タスク色 */

    gradients.push(
      `${task.color} ${startPercent}% ${endPercent}%`
    );

    currentPercent = endPercent;

    /* ===== ラベル ===== */

    const middleMinutes =
      startMinutes + (task.duration / 2);

    const angle =
      (middleMinutes / 1440) * 360 - 90;

    const radius = 105;

    const x =
      125 + radius *
      Math.cos(angle * Math.PI / 180);

    const y =
      125 + radius *
      Math.sin(angle * Math.PI / 180);

    const label =
      document.createElement("div");

    label.className = "chart-label";

    label.style.left = `${x}px`;

    label.style.top = `${y}px`;

    label.innerHTML = `
      ${task.name}<br>
      ${task.start}〜
      ${minutesToTime(endMinutes)}
    `;

    chart.appendChild(label);

  });

  /* 最後空白 */

  if(currentPercent < 100){

    gradients.push(
      `#d8e8da ${currentPercent}% 100%`
    );
  }

  chart.style.background =
    `conic-gradient(${gradients.join(",")})`;
}

/* 実行 */

createChart();

/* =======================================
   目標一覧生成
======================================= */

function createGoals(){

  const goalList =
    document.getElementById("goalList");

  goalList.innerHTML = "";

  goals.slice(0, 5).forEach(goal => {

    goalList.innerHTML += `

      <div class="goal-item">

        <div class="goal-text">
          ${goal}
        </div>

        <button class="cancel-btn"
                onclick="cancelGoal(this)">
          取消
        </button>

        <button class="circle-btn"
                onclick="doneGoal(this)">
          ○
        </button>

        <button class="delete-btn"
                onclick="openReasonModal(this)">
          ×
        </button>

      </div>

    `;

  });

}

/* 実行 */

createGoals();

/* =======================================
   タイトル切り替え
======================================= */

let isGroup = false;

function changeGoal(){

  const title =
    document.getElementById("goalTitle");

  if(isGroup === false){

    title.textContent =
      "本日のグループ目標一覧";

    isGroup = true;

  }else{

    title.textContent =
      "本日の目標一覧";

    isGroup = false;
  }
}

/* =======================================
   ○ボタン
======================================= */

function doneGoal(button){

  const item =
    button.parentElement;

  const cancelBtn =
    item.querySelector(".cancel-btn");

  const circleBtn =
    item.querySelector(".circle-btn");

  const deleteBtn =
    item.querySelector(".delete-btn");

  circleBtn.style.display = "none";

  deleteBtn.style.display = "none";

  cancelBtn.style.display = "block";
}

/* =======================================
   ×ボタン
======================================= */

let currentItem = null;

function openReasonModal(button){

  currentItem =
    button.parentElement;

  /* モーダル表示 */

  document.getElementById("overlay")
    .style.display = "flex";

  /* 円グラフラベル非表示 */

  document.getElementById("circleChart")
    .classList.add("hide-labels");
}

/* =======================================
   登録
======================================= */

function registerReason(){

  const selected =
    document.querySelector(
      'input[name="reason"]:checked'
    );

  if(!selected){

    alert("理由を選択してください");

    return;
  }

  const cancelBtn =
    currentItem.querySelector(".cancel-btn");

  const circleBtn =
    currentItem.querySelector(".circle-btn");

  const deleteBtn =
    currentItem.querySelector(".delete-btn");

  circleBtn.style.display = "none";

  deleteBtn.style.display = "none";

  cancelBtn.style.display = "block";

  /* モーダル閉じる */

  document.getElementById("overlay")
    .style.display = "none";

  /* 円グラフラベル再表示 */

  document.getElementById("circleChart")
    .classList.remove("hide-labels");

  selected.checked = false;
}

/* =======================================
   取消
======================================= */

function cancelGoal(button){

  const item =
    button.parentElement;

  const cancelBtn =
    item.querySelector(".cancel-btn");

  const circleBtn =
    item.querySelector(".circle-btn");

  const deleteBtn =
    item.querySelector(".delete-btn");

  cancelBtn.style.display = "none";

  circleBtn.style.display = "block";

  deleteBtn.style.display = "flex";

  /* 円グラフラベル再表示 */

  document.getElementById("circleChart")
    .classList.remove("hide-labels");
}

/* ===================================================== */
/* 下メニュー切り替え */
/* ===================================================== */

const menuButtons =
  document.querySelectorAll(".menu-btn");

menuButtons.forEach(button => {

  button.addEventListener("click", () => {

    menuButtons.forEach(btn => {
      btn.classList.remove("active-btn");
    });

    button.classList.add("active-btn");

  });

});

</script>

</body>
</html>
